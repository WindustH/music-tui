name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Clippy + tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Clippy
        # No `-D warnings`: path-dependency crates (framework-tui / img-tui)
        # carry a few of their own lints and stay warning-free separately.
        run: cargo clippy --workspace

      - name: Tests
        run: cargo test --workspace
