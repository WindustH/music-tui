[package]
name = "music-tui"
version = "0.1.13"
edition = "2024"
rust-version = "1.90"
license = "MIT"
description = "Terminal music player client for MPD built with framework-tui and img-tui"

[workspace]
members = [
  ".",
  "crates/framework-tui",
  "crates/img-tui",
]
resolver = "3"

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
framework-tui = { path = "crates/framework-tui", features = ["serde"] }
hex = "0.4.3"
image = "0.25.10"
img-tui = { path = "crates/img-tui", features = ["cache", "terminal", "chafa"] }
lofty = "0.22.4"
mpd_client = "1.4.1"
ratatui = "0.30.2"
rusqlite = { version = "0.32", default-features = false, features = ["column_decltype"] }
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.11.0"
tokio = { version = "1.52.3", features = ["full"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-width = "0.2.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustfft = "6.4"

[target.'cfg(windows)'.dependencies]
rusqlite = { version = "0.32", default-features = false, features = ["column_decltype", "bundled"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "warn"

[[bin]]
name = "music-tui"
path = "src/main.rs"
test = false

[patch."https://github.com/WindustH/framework-tui"]
framework-tui = { path = "crates/framework-tui" }
